<!--
  Prototype: OVERDRIVE
  Influence dials: trippy 3 / beautiful 1 / technical 0 / dancing 2 / colorful 5 / intense 5
  Mapping: kick -> particle burst + shockwave ring + core punch (rate-limited bloom);
           loudness -> "charge" energy field (spectrum rays, warp tunnel, trail length, hue speed);
           snare/high flux -> spark sprays + glitter; melody notes (SCORE) or mid onsets (FFT) -> comets
           whose angle = pitch and colour = pitch class; sustained high charge -> OVERDRIVE climax state.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overdrive — music visualizer prototype</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: #eee;
    font: 14px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; }
  .top { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 10px;
    padding: 12px 14px; pointer-events: none; flex-wrap: wrap; }
  .brand { font-weight: 800; letter-spacing: .28em; font-size: 13px;
    background: linear-gradient(90deg,#ff2d6f,#ffb800,#28f0ff,#b04dff); -webkit-background-clip: text;
    background-clip: text; color: transparent; }
  .badge { font: 700 11px/1 ui-monospace, Menlo, Consolas, monospace; letter-spacing: .12em;
    padding: 4px 7px; border-radius: 4px; border: 1px solid rgba(255,255,255,.35); color: #ddd; }
  .badge.score { border-color: #ffb800; color: #ffb800; box-shadow: 0 0 10px rgba(255,184,0,.35); }
  .track { opacity: .7; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 60vw; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 12px 14px;
    background: linear-gradient(to top, rgba(0,0,0,.75), rgba(0,0,0,0));
    display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; align-items: center; gap: 10px; min-width: 0; flex-wrap: wrap; }
  .row.transport { flex-wrap: nowrap; }
  button, .pick { appearance: none; border: 1px solid rgba(255,255,255,.28); background: rgba(255,255,255,.06);
    color: #eee; border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 12px; cursor: pointer;
    white-space: nowrap; }
  button:hover, .pick:hover { background: rgba(255,255,255,.14); }
  button:disabled { opacity: .4; cursor: default; }
  #play { width: 40px; height: 40px; padding: 0; font-size: 15px; flex: none; }
  .time { font: 12px ui-monospace, Menlo, Consolas, monospace; opacity: .8; flex: none; min-width: 38px; }
  #seek { flex: 1 1 auto; min-width: 60px; accent-color: #ff2d6f; }
  .pick input { display: none; }
  .hint { font-size: 11px; opacity: .55; }
  #drop { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    border: 2px dashed rgba(255,255,255,.5); background: rgba(0,0,0,.55); font-size: 18px; letter-spacing: .2em;
    pointer-events: none; }
  #drop.on { display: flex; }
  #idle { position: fixed; left: 0; right: 0; top: 42%; text-align: center; pointer-events: none;
    font-size: 12px; letter-spacing: .3em; opacity: .55; transition: opacity .6s; }
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas></div>
<div class="top">
  <span class="brand">OVERDRIVE</span>
  <span id="badge" class="badge">FFT</span>
  <span id="track" class="track">No track loaded</span>
</div>
<div id="idle">DROP A TRACK · OR PICK ONE BELOW</div>
<div class="bar">
  <div class="row transport">
    <button id="play" aria-label="Play" disabled>&#9654;</button>
    <span id="cur" class="time">0:00</span>
    <input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek" disabled>
    <span id="tot" class="time">0:00</span>
  </div>
  <div class="row">
    <label class="pick">Audio file…<input id="fAudio" type="file" accept="audio/*"></label>
    <label class="pick">Sidecar .viz.json…<input id="fViz" type="file" accept=".json,application/json"></label>
    <span class="hint">space = play/pause · drag &amp; drop works</span>
  </div>
</div>
<div id="drop">DROP AUDIO</div>
<audio id="audio" preload="auto"></audio>

<script>
  // ---- container song selector (producer patch 2026-10-21) ----
  (function () {
    var s = new URLSearchParams(location.search).get('song');
    if (!s) return;
    s = s.toLowerCase().replace(/[^a-z0-9-]/g, '');
    if (!s || s === 'demo') return;
    window.__songTitle = s.replace(/-/g, ' ').replace(/\b\w/g, function (c) { return c.toUpperCase(); });
    var of = window.fetch.bind(window);
    window.fetch = function (u, o) {
      if (typeof u === 'string') {
        u = u.split('../assets/demo.mp3').join('../assets/' + s + '.mp3')
             .split('../assets/demo.viz.json').join('../assets/' + s + '.viz.json')
             .split('../assets/demo.dance.json').join('../assets/' + s + '.dance.json');
      }
      return of(u, o);
    };
  })();

(function () {
  "use strict";

  // ---------- DOM ----------
  var cv = document.getElementById("cv"), ctx = cv.getContext("2d");
  var audio = document.getElementById("audio");
  var playBtn = document.getElementById("play"), seek = document.getElementById("seek");
  var curEl = document.getElementById("cur"), totEl = document.getElementById("tot");
  var badge = document.getElementById("badge"), trackEl = document.getElementById("track");
  var idleEl = document.getElementById("idle"), dropEl = document.getElementById("drop");

  // ---------- motion preference ----------
  var mq = window.matchMedia ? window.matchMedia("(prefers-reduced-motion: reduce)") : null;
  var calm = !!(mq && mq.matches);
  if (mq) {
    var onMq = function () { calm = mq.matches; };
    if (mq.addEventListener) mq.addEventListener("change", onMq); else if (mq.addListener) mq.addListener(onMq);
  }

  // ---------- canvas sizing ----------
  var W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = Math.max(1, Math.round(W * DPR)); cv.height = Math.max(1, Math.round(H * DPR));
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
  }
  window.addEventListener("resize", resize);
  resize();

  // ---------- audio graph ----------
  var actx = null, analyser = null, srcNode = null, freq = null, wave = null;
  var binHz = 0, lowR = [0, 0], midR = [0, 0], highR = [0, 0], prevLow = null, prevMH = null;
  var logBins = [];               // 64 log-spaced bin ranges, 30 Hz – 12 kHz
  var NRAY = 64;
  function bandRange(f0, f1) {
    var a = Math.max(1, Math.round(f0 / binHz)), b = Math.min(analyser.frequencyBinCount - 1, Math.round(f1 / binHz));
    return [a, Math.max(a, b)];
  }
  function ensureAudio() {
    if (actx) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    actx = new AC();
    analyser = actx.createAnalyser();
    analyser.fftSize = 2048;
    analyser.smoothingTimeConstant = 0.55;
    srcNode = actx.createMediaElementSource(audio);
    srcNode.connect(analyser); analyser.connect(actx.destination);
    freq = new Uint8Array(analyser.frequencyBinCount);
    wave = new Uint8Array(analyser.fftSize);
    binHz = actx.sampleRate / analyser.fftSize;
    lowR = bandRange(20, 140); midR = bandRange(140, 2000); highR = bandRange(2000, 12000);
    prevLow = new Float32Array(lowR[1] - lowR[0] + 1);
    prevMH = new Float32Array(highR[1] - midR[0] + 1);
    logBins = [];
    for (var i = 0; i < NRAY; i++) {
      var f0 = 30 * Math.pow(400, i / NRAY), f1 = 30 * Math.pow(400, (i + 1) / NRAY);
      logBins.push(bandRange(f0, f1));
    }
  }

  // ---------- loading ----------
  var objUrl = null, hasTrack = false;
  var sidecar = null, sidecarSrc = null; // 'demo' | 'user'
  function setTrack(url, name) {
    if (objUrl && objUrl !== url) URL.revokeObjectURL(objUrl);
    objUrl = url;
    audio.src = url; audio.load();
    trackEl.textContent = name;
    hasTrack = true;
    playBtn.disabled = false; seek.disabled = false;
    idleEl.style.opacity = "0";
    resetCursors();
  }
  function loadFile(file) {
    if (!file) return;
    if (sidecarSrc === "demo") setSidecar(null, null);
    setTrack(URL.createObjectURL(file), file.name.replace(/\.[^.]+$/, ""));
  }
  function normSidecar(j) {
    if (!j || typeof j !== "object") return null;
    function nums(a) { return Array.isArray(a) ? a.filter(function (x) { return typeof x === "number" && isFinite(x); }).sort(function (a, b) { return a - b; }) : []; }
    var mel = Array.isArray(j.melody) ? j.melody.filter(function (n) { return n && isFinite(n.t) && isFinite(n.midi); })
      .map(function (n) { return { t: +n.t, midi: +n.midi, dur: isFinite(n.dur) ? +n.dur : 0.2 }; })
      .sort(function (a, b) { return a.t - b.t; }) : [];
    var sec = Array.isArray(j.sections) ? j.sections.filter(function (s) { return s && isFinite(s.t); })
      .map(function (s) { return { t: +s.t, name: String(s.name || ""), energy: isFinite(s.energy) ? Math.max(0, Math.min(1, +s.energy)) : 0.5 }; })
      .sort(function (a, b) { return a.t - b.t; }) : [];
    return { kick: nums(j.kick), snare: nums(j.snare), melody: mel, sections: sec };
  }
  function setSidecar(sc, src) {
    sidecar = sc; sidecarSrc = sc ? src : null;
    badge.textContent = sc ? "SCORE" : "FFT";
    badge.className = sc ? "badge score" : "badge";
    resetCursors();
  }
  // a) auto-fetch demo; fall back silently on any failure (file:// CORS etc.)
  fetch("../assets/demo.mp3").then(function (r) {
    if (!r.ok) throw new Error("no demo");
    return r.blob();
  }).then(function (b) {
    if (hasTrack || !b || b.size < 1024) return;
    setTrack(URL.createObjectURL(b), (window.__songTitle || 'Mountain King v1 (demo)'));
    return fetch("../assets/demo.viz.json").then(function (r) {
      if (!r.ok) throw new Error("no sidecar");
      return r.json();
    }).then(function (j) {
      var sc = normSidecar(j);
      if (sc && !sidecar && trackEl.textContent === (window.__songTitle || 'Mountain King v1 (demo)')) setSidecar(sc, "demo");
    }).catch(function () {});
  }).catch(function () {});

  // b) drag and drop
  var dragDepth = 0;
  window.addEventListener("dragenter", function (e) { e.preventDefault(); dragDepth++; dropEl.className = "on"; });
  window.addEventListener("dragover", function (e) { e.preventDefault(); });
  window.addEventListener("dragleave", function () { if (--dragDepth <= 0) { dragDepth = 0; dropEl.className = ""; } });
  window.addEventListener("drop", function (e) {
    e.preventDefault(); dragDepth = 0; dropEl.className = "";
    var files = e.dataTransfer && e.dataTransfer.files; if (!files) return;
    for (var i = 0; i < files.length; i++) {
      var f = files[i];
      if (/\.json$/i.test(f.name)) readSidecarFile(f);
      else if (/^audio\//.test(f.type) || /\.(mp3|wav|ogg|flac|m4a|aac|opus|webm)$/i.test(f.name)) loadFile(f);
    }
  });
  // c) pickers
  document.getElementById("fAudio").addEventListener("change", function (e) { loadFile(e.target.files[0]); e.target.value = ""; });
  document.getElementById("fViz").addEventListener("change", function (e) { readSidecarFile(e.target.files[0]); e.target.value = ""; });
  function readSidecarFile(f) {
    if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      try { var sc = normSidecar(JSON.parse(rd.result)); if (sc) setSidecar(sc, "user"); }
      catch (err) { trackEl.textContent = trackEl.textContent.replace(/ · bad sidecar$/, "") + " · bad sidecar"; }
    };
    rd.readAsText(f);
  }

  // ---------- transport ----------
  function fmt(s) { if (!isFinite(s) || s < 0) s = 0; var m = Math.floor(s / 60), x = Math.floor(s % 60); return m + ":" + (x < 10 ? "0" : "") + x; }
  function toggle() {
    if (!hasTrack) return;
    ensureAudio();
    if (actx.state === "suspended") actx.resume();
    if (audio.paused) audio.play().catch(function () {}); else audio.pause();
  }
  playBtn.addEventListener("click", function () { toggle(); playBtn.blur(); });
  audio.addEventListener("play", function () { playBtn.innerHTML = "&#10074;&#10074;"; playBtn.setAttribute("aria-label", "Pause"); });
  audio.addEventListener("pause", function () { playBtn.innerHTML = "&#9654;"; playBtn.setAttribute("aria-label", "Play"); });
  audio.addEventListener("ended", function () { playBtn.innerHTML = "&#9654;"; });
  audio.addEventListener("loadedmetadata", function () { totEl.textContent = fmt(audio.duration); });
  audio.addEventListener("seeking", resetCursors);
  audio.addEventListener("seeked", resetCursors);
  var seeking = false;
  seek.addEventListener("input", function () {
    seeking = true;
    if (isFinite(audio.duration)) { audio.currentTime = seek.value / 1000 * audio.duration; curEl.textContent = fmt(audio.currentTime); }
  });
  seek.addEventListener("change", function () { seeking = false; seek.blur(); });
  document.addEventListener("keydown", function (e) {
    if (e.code === "Space" || e.key === " ") { e.preventDefault(); if (!e.repeat) toggle(); }
  });
  document.addEventListener("keyup", function (e) { if (e.code === "Space" || e.key === " ") e.preventDefault(); });

  // ---------- SCORE cursors ----------
  var LOOK = 0.05;
  var cur = { kick: 0, snare: 0, melody: 0, section: -1 };
  function lowerBound(arr, t, key) {
    var lo = 0, hi = arr.length;
    while (lo < hi) { var m = (lo + hi) >> 1; var v = key ? arr[m][key] : arr[m]; if (v < t) lo = m + 1; else hi = m; }
    return lo;
  }
  function resetCursors() {
    if (!sidecar) return;
    var t = audio.currentTime || 0;
    cur.kick = lowerBound(sidecar.kick, t);
    cur.snare = lowerBound(sidecar.snare, t);
    cur.melody = lowerBound(sidecar.melody, t, "t");
    cur.section = lowerBound(sidecar.sections, t + 1e-6, "t") - 1;
  }

  // ---------- state ----------
  var E = { low: 0, mid: 0, high: 0 };              // smoothed, normalised 0..1
  var peak = { low: 0.3, mid: 0.3, high: 0.3 };
  var spec = new Float32Array(NRAY);
  var fluxHist = [], mhHist = [], lastKick = -9, lastSnare = -9, lastMidOn = -9, lastBloom = -9;
  var loudShort = 0, loudPeak = 0.25, charge = 0, chargeHold = 0, overdrive = 0;
  var hue = 330, punch = 0, bloom = 0, shake = 0, spin = 0, warp = 0, clock = 0;
  var centroid = 0.3, sectionEnergy = -1, sectionName = "";
  var idlePhase = 0;

  // ---------- pools ----------
  var parts = [], rings = [], comets = [], sparks = [];
  function maxParts() { return calm ? 260 : 1600; }

  function kick(strength) {
    strength = Math.max(0.25, Math.min(1, strength));
    var now = clock;
    punch = Math.min(1.4, punch + 0.6 + strength * 0.6);
    // bloom: soft full-screen lift, hard rate-limited to <= 2.5/s (spec: no strobe > 3/s)
    if (!calm && now - lastBloom >= 0.4) { bloom = Math.max(bloom, 0.25 + 0.45 * strength * (0.4 + charge)); lastBloom = now; }
    if (!calm) shake = Math.max(shake, (3 + 9 * charge) * strength);
    var cx = W / 2, cy = H / 2, base = Math.min(W, H);
    rings.push({ r: base * 0.06, v: base * (0.9 + 0.9 * strength + charge), life: 1, hue: hue, w: 3 + 10 * strength * (0.5 + charge) });
    if (charge > 0.55 && !calm) rings.push({ r: base * 0.03, v: base * 0.55, life: 1, hue: hue + 180, w: 2 + 4 * strength });
    var n = Math.round((calm ? 18 : 60 + 220 * charge) * strength);
    for (var i = 0; i < n && parts.length < maxParts(); i++) {
      var a = Math.random() * Math.PI * 2, sp = base * (0.25 + Math.random() * (0.9 + 1.4 * charge)) * (calm ? 0.4 : 1);
      parts.push({ x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, decay: 0.6 + Math.random() * 0.9,
        hue: hue + (Math.random() - 0.5) * 80 + (Math.random() < 0.15 ? 180 : 0), s: 1 + Math.random() * 2.5 });
    }
  }
  function snare(strength) {
    var base = Math.min(W, H), cx = W / 2, cy = H / 2, n = Math.round((calm ? 6 : 26) * strength);
    var a0 = Math.random() * Math.PI * 2;
    for (var k = 0; k < 2; k++) {
      var ang = a0 + k * Math.PI;
      for (var i = 0; i < n; i++) {
        var a = ang + (Math.random() - 0.5) * 0.6, sp = base * (0.6 + Math.random() * 1.2) * (calm ? 0.4 : 1);
        sparks.push({ x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, hue: hue + 120 + Math.random() * 40 });
      }
    }
    spin += (calm ? 0.1 : 0.5) * strength;
  }
  function comet(midiOrAngle, isMidi, strength) {
    var a, h;
    if (isMidi) { a = -Math.PI / 2 + ((midiOrAngle - 60) / 24) * Math.PI; h = (midiOrAngle % 12) * 30; }
    else { a = midiOrAngle; h = hue + 90; }
    var base = Math.min(W, H);
    comets.push({ a: a, r: base * 0.08, v: base * (0.5 + 0.5 * strength) * (calm ? 0.5 : 1), life: 1, hue: h, w: 2 + 4 * strength, trail: [] });
  }

  // ---------- analysis ----------
  function analyse(dt, playing) {
    var t = audio.currentTime;
    var lowV = 0, midV = 0, highV = 0, flux = 0, mh = 0, i, v, d, cw = 0, cs = 0;
    if (playing && analyser) {
      analyser.getByteFrequencyData(freq);
      for (i = lowR[0]; i <= lowR[1]; i++) { v = freq[i] / 255; lowV += v; d = v - prevLow[i - lowR[0]]; if (d > 0) flux += d; prevLow[i - lowR[0]] = v; }
      lowV /= (lowR[1] - lowR[0] + 1); flux /= (lowR[1] - lowR[0] + 1);
      for (i = midR[0]; i <= midR[1]; i++) midV += freq[i] / 255;
      midV /= (midR[1] - midR[0] + 1);
      for (i = highR[0]; i <= highR[1]; i++) highV += freq[i] / 255;
      highV /= (highR[1] - highR[0] + 1);
      for (i = midR[0]; i <= highR[1]; i++) { v = freq[i] / 255; d = v - prevMH[i - midR[0]]; if (d > 0) mh += d * (i > midR[1] ? 1.6 : 0.6); prevMH[i - midR[0]] = v; cw += v * i; cs += v; }
      mh /= (highR[1] - midR[0] + 1);
      if (cs > 0) centroid += ((cw / cs) / highR[1] - centroid) * 0.05;
      for (i = 0; i < NRAY; i++) {
        var r = logBins[i], s = 0;
        for (var j = r[0]; j <= r[1]; j++) s += freq[j];
        s = s / ((r[1] - r[0] + 1) * 255);
        spec[i] += (s - spec[i]) * (s > spec[i] ? 0.6 : 0.15);
      }
    } else {
      // idle: gentle synthetic pulse (~96 BPM), low amplitude
      idlePhase += dt * 1.6;
      var ph = idlePhase % 1, env = Math.exp(-ph * 6);
      lowV = 0.15 + 0.35 * env; midV = 0.18 + 0.06 * Math.sin(clock * 0.7); highV = 0.08 + 0.04 * Math.sin(clock * 1.3);
      if (ph < dt * 1.6 && !playing) kick(0.3);
      for (i = 0; i < NRAY; i++) {
        var tgt = 0.12 + 0.1 * Math.sin(clock * 0.9 + i * 0.35) * Math.sin(i * 0.17 + clock * 0.3) + env * 0.15 * (1 - i / NRAY);
        spec[i] += (tgt - spec[i]) * 0.1;
      }
    }
    // normalise against slowly-decaying peaks, then attack-fast / decay-slow smoothing
    var dec = Math.pow(0.9995, dt * 60);
    function upd(k, raw) {
      peak[k] = Math.max(raw, peak[k] * dec, 0.18);
      var n = Math.min(1, raw / peak[k]);
      n = n * n;                                       // expand dynamics
      var a = n > E[k] ? 1 - Math.pow(0.4, dt * 60) : 1 - Math.pow(0.93, dt * 60);
      E[k] += (n - E[k]) * a;
    }
    upd("low", lowV); upd("mid", midV); upd("high", highV);

    // loudness -> charge (slow build, the energy field's "battery")
    var loud = (lowV * 0.45 + midV * 0.35 + highV * 0.2);
    loudShort += (loud - loudShort) * (1 - Math.pow(0.985, dt * 60));
    loudPeak = Math.max(loudShort, loudPeak * Math.pow(0.9997, dt * 60), 0.12);
    var target = Math.max(0, Math.min(1, (loudShort / loudPeak - 0.55) / 0.42));
    if (!playing) target = 0.12;

    // SCORE events
    if (sidecar && playing) {
      var la = t + LOOK;
      while (cur.kick < sidecar.kick.length && sidecar.kick[cur.kick] <= la) { kick(0.6 + 0.4 * E.low); cur.kick++; lastKick = clock; }
      while (cur.snare < sidecar.snare.length && sidecar.snare[cur.snare] <= la) { snare(0.8); cur.snare++; lastSnare = clock; }
      while (cur.melody < sidecar.melody.length && sidecar.melody[cur.melody].t <= la) {
        var nt = sidecar.melody[cur.melody]; comet(nt.midi, true, Math.min(1, 0.4 + nt.dur)); cur.melody++;
      }
      var secs = sidecar.sections;
      while (cur.section + 1 < secs.length && secs[cur.section + 1].t <= la) {
        cur.section++; sectionName = secs[cur.section].name;
        // section change: a big slow ring (no flash)
        rings.push({ r: 10, v: Math.min(W, H) * 0.45, life: 1, hue: hue + 60, w: 18 });
      }
      sectionEnergy = cur.section >= 0 ? secs[cur.section].energy : -1;
      if (sectionEnergy >= 0) target = target * 0.5 + sectionEnergy * 0.5;
    } else sectionEnergy = -1;

    var cRate = target > charge ? 0.012 : 0.02;
    charge += (target - charge) * (1 - Math.pow(1 - cRate, dt * 60));

    // FFT kick: low-band spectral flux vs adaptive threshold, >= 250 ms cooldown
    if (playing && analyser) {
      fluxHist.push(flux); if (fluxHist.length > 43) fluxHist.shift();
      var m = 0, sd = 0; for (i = 0; i < fluxHist.length; i++) m += fluxHist[i]; m /= fluxHist.length;
      for (i = 0; i < fluxHist.length; i++) sd += (fluxHist[i] - m) * (fluxHist[i] - m); sd = Math.sqrt(sd / fluxHist.length);
      var thr = m + 1.5 * sd + 0.012;
      if (!sidecar && flux > thr && lowV > 0.25 && clock - lastKick >= 0.25) {
        kick(Math.min(1, 0.4 + (flux - thr) / (thr + 1e-3))); lastKick = clock;
      }
      mhHist.push(mh); if (mhHist.length > 43) mhHist.shift();
      var m2 = 0, sd2 = 0; for (i = 0; i < mhHist.length; i++) m2 += mhHist[i]; m2 /= mhHist.length;
      for (i = 0; i < mhHist.length; i++) sd2 += (mhHist[i] - m2) * (mhHist[i] - m2); sd2 = Math.sqrt(sd2 / mhHist.length);
      var thr2 = m2 + 1.8 * sd2 + 0.006;
      if (!sidecar && mh > thr2 && clock - lastSnare >= 0.18) { snare(Math.min(1, 0.5 + (mh - thr2) / (thr2 + 1e-3))); lastSnare = clock; }
      // FFT melody stand-in: mid onsets launch comets aimed by the loudest mid ray
      if (!sidecar && mh > thr2 * 0.8 && E.mid > 0.45 && clock - lastMidOn >= 0.22) {
        var bi = 0, bv = -1; for (i = 14; i < 50; i++) if (spec[i] > bv) { bv = spec[i]; bi = i; }
        comet(-Math.PI / 2 + ((bi - 32) / 18) * Math.PI, false, E.mid); lastMidOn = clock;
      }
    }

    // climax: sustained high charge latches OVERDRIVE
    if (charge > 0.8) chargeHold += dt; else chargeHold = Math.max(0, chargeHold - dt * 2);
    var odT = chargeHold > 1.2 ? 1 : 0;
    overdrive += (odT - overdrive) * (1 - Math.pow(0.97, dt * 60));
  }

  // ---------- render ----------
  function hsl(h, s, l, a) { return "hsla(" + ((h % 360) + 360) % 360 + "," + s + "%," + l + "%," + a + ")"; }

  function frame(dt, playing) {
    var cx = W / 2, cy = H / 2, base = Math.min(W, H), i, p;
    var motion = calm ? 0.35 : 1;
    hue += dt * (12 + 70 * charge + 120 * overdrive) * motion;
    var hueC = hue + centroid * 120;
    warp += dt * (0.25 + 1.6 * charge + 1.5 * overdrive) * motion;
    spin += dt * (0.08 + 0.5 * E.mid + 0.8 * overdrive) * motion;
    punch *= Math.pow(0.86, dt * 60);
    bloom *= Math.pow(0.85, dt * 60);
    shake *= Math.pow(0.82, dt * 60);

    // trails: longer at higher charge
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = "rgba(0,0,0," + (calm ? 0.35 : (0.3 - 0.17 * charge)).toFixed(3) + ")";
    ctx.fillRect(0, 0, W, H);

    var sx = (Math.random() - 0.5) * shake, sy = (Math.random() - 0.5) * shake;
    ctx.setTransform(DPR, 0, 0, DPR, sx * DPR, sy * DPR);
    ctx.globalCompositeOperation = "lighter";

    // energy field glow (builds with charge)
    var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, base * (0.5 + 0.5 * charge));
    g.addColorStop(0, hsl(hueC, 100, 55, 0.08 + 0.22 * charge + 0.15 * punch * 0.5));
    g.addColorStop(0.5, hsl(hueC + 60, 100, 45, 0.04 + 0.12 * charge));
    g.addColorStop(1, hsl(hueC + 120, 100, 40, 0));
    ctx.fillStyle = g; ctx.fillRect(-20, -20, W + 40, H + 40);

    // bloom (rate-limited, smooth decay — never a hard strobe)
    if (bloom > 0.01) {
      ctx.fillStyle = hsl(hueC, 100, 60, bloom * 0.28);
      ctx.fillRect(-20, -20, W + 40, H + 40);
    }

    // warp tunnel: polygons streaming outward, speed = charge
    var NT = 9, sides = 6, maxR = Math.hypot(W, H) * 0.6;
    ctx.lineWidth = 1.5;
    for (i = 0; i < NT; i++) {
      var f = ((i / NT) + warp * 0.18) % 1, rr = maxR * f * f;
      var al = (0.05 + 0.3 * charge + 0.2 * overdrive) * Math.sin(f * Math.PI);
      if (al < 0.01) continue;
      ctx.strokeStyle = hsl(hueC + i * 40, 100, 60, al);
      ctx.beginPath();
      for (var k = 0; k <= sides; k++) {
        var a = (k / sides) * Math.PI * 2 + spin * 0.3 + f * 1.2;
        var px = cx + Math.cos(a) * rr, py = cy + Math.sin(a) * rr;
        if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();
    }

    // spectrum rays (mirrored, full circle)
    var coreR = base * (0.07 + 0.05 * E.mid + 0.05 * punch);
    var rayMax = base * (0.18 + 0.32 * charge + 0.12 * overdrive);
    ctx.lineCap = "round";
    for (i = 0; i < NRAY; i++) {
      var len = coreR + spec[i] * spec[i] * rayMax * 1.6 + punch * base * 0.03 * (1 - i / NRAY);
      var w = 1.2 + 2.6 * spec[i];
      ctx.strokeStyle = hsl(hueC + i * 4, 100, 50 + 15 * spec[i], 0.25 + 0.6 * spec[i]);
      ctx.lineWidth = w;
      for (var s2 = 0; s2 < 2; s2++) {
        var ang = (s2 ? -1 : 1) * ((i + 0.5) / NRAY) * Math.PI - Math.PI / 2 + spin * 0.15;
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(ang) * coreR, cy + Math.sin(ang) * coreR);
        ctx.lineTo(cx + Math.cos(ang) * len, cy + Math.sin(ang) * len);
        ctx.stroke();
      }
    }

    // shockwave rings
    for (i = rings.length - 1; i >= 0; i--) {
      p = rings[i];
      p.r += p.v * dt; p.v *= Math.pow(0.975, dt * 60); p.life -= dt * (calm ? 1.2 : 0.85);
      if (p.life <= 0) { rings.splice(i, 1); continue; }
      ctx.strokeStyle = hsl(p.hue, 100, 62, p.life * (calm ? 0.35 : 0.8));
      ctx.lineWidth = p.w * p.life * (calm ? 0.5 : 1);
      ctx.beginPath(); ctx.arc(cx, cy, p.r, 0, Math.PI * 2); ctx.stroke();
    }

    // core: spinning star polygon, punched by kick
    var cr = coreR * (1 + 0.25 * punch);
    var pts = 5 + Math.round(3 * E.high);
    ctx.fillStyle = hsl(hueC + 200, 100, 55, 0.35 + 0.4 * E.low);
    ctx.beginPath();
    for (i = 0; i < pts * 2; i++) {
      var ra = i % 2 ? cr * (0.45 + 0.2 * E.mid) : cr;
      var aa = (i / (pts * 2)) * Math.PI * 2 - spin;
      if (i === 0) ctx.moveTo(cx + Math.cos(aa) * ra, cy + Math.sin(aa) * ra); else ctx.lineTo(cx + Math.cos(aa) * ra, cy + Math.sin(aa) * ra);
    }
    ctx.closePath(); ctx.fill();
    var cg = ctx.createRadialGradient(cx, cy, 0, cx, cy, cr * 1.6);
    cg.addColorStop(0, hsl(hueC, 100, 85, 0.5 + 0.3 * punch));
    cg.addColorStop(1, hsl(hueC, 100, 50, 0));
    ctx.fillStyle = cg; ctx.beginPath(); ctx.arc(cx, cy, cr * 1.6, 0, Math.PI * 2); ctx.fill();

    // comets (melody)
    ctx.lineCap = "round";
    for (i = comets.length - 1; i >= 0; i--) {
      p = comets[i];
      p.r += p.v * dt; p.a += dt * 0.6 * motion; p.life -= dt * 0.7;
      var x = cx + Math.cos(p.a) * p.r, y = cy + Math.sin(p.a) * p.r;
      p.trail.push(x, y); if (p.trail.length > 24) p.trail.splice(0, 2);
      if (p.life <= 0) { comets.splice(i, 1); continue; }
      ctx.strokeStyle = hsl(p.hue, 100, 65, p.life * 0.8); ctx.lineWidth = p.w * p.life;
      ctx.beginPath(); ctx.moveTo(p.trail[0], p.trail[1]);
      for (k = 2; k < p.trail.length; k += 2) ctx.lineTo(p.trail[k], p.trail[k + 1]);
      ctx.stroke();
      ctx.fillStyle = hsl(p.hue, 100, 80, p.life);
      ctx.beginPath(); ctx.arc(x, y, p.w * 1.2, 0, Math.PI * 2); ctx.fill();
    }

    // burst particles
    var drag = Math.pow(0.955, dt * 60);
    for (i = parts.length - 1; i >= 0; i--) {
      p = parts[i];
      p.vx *= drag; p.vy *= drag; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt * p.decay;
      if (p.life <= 0 || p.x < -50 || p.y < -50 || p.x > W + 50 || p.y > H + 50) { parts[i] = parts[parts.length - 1]; parts.pop(); continue; }
      ctx.fillStyle = hsl(p.hue, 100, 60, p.life);
      var sz = p.s * (0.6 + p.life);
      ctx.fillRect(p.x - sz / 2, p.y - sz / 2, sz, sz);
    }
    // snare sparks: streaks
    ctx.lineWidth = 1.5;
    for (i = sparks.length - 1; i >= 0; i--) {
      p = sparks[i];
      p.vx *= Math.pow(0.93, dt * 60); p.vy *= Math.pow(0.93, dt * 60);
      p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt * 1.8;
      if (p.life <= 0) { sparks[i] = sparks[sparks.length - 1]; sparks.pop(); continue; }
      ctx.strokeStyle = hsl(p.hue, 100, 70, p.life);
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 0.04, p.y - p.vy * 0.04); ctx.stroke();
    }
    // high-band glitter
    var ng = Math.round(E.high * E.high * (calm ? 6 : 40) * (0.5 + charge));
    for (i = 0; i < ng; i++) {
      var gr = base * (0.15 + Math.random() * 0.6), ga = Math.random() * Math.PI * 2;
      ctx.fillStyle = hsl(hueC + 180 + Math.random() * 60, 100, 75, 0.4 + Math.random() * 0.5);
      ctx.fillRect(cx + Math.cos(ga) * gr * (W / base), cy + Math.sin(ga) * gr, 1.6, 1.6);
    }

    // OVERDRIVE climax label + section name
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalCompositeOperation = "source-over";
    if (overdrive > 0.02) {
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      var fs = Math.max(26, base * 0.11);
      ctx.font = "900 " + fs + "px system-ui, sans-serif";
      ctx.fillStyle = hsl(hueC + 180, 100, 65, 0.16 * overdrive);
      ctx.fillText("OVERDRIVE", cx, cy + base * 0.32);
    }
    if (sidecar && sectionName && playing) {
      ctx.textAlign = "right"; ctx.textBaseline = "top";
      ctx.font = "600 11px ui-monospace, Menlo, monospace";
      ctx.fillStyle = "rgba(255,255,255,0.5)";
      ctx.fillText(sectionName.toUpperCase(), W - 14, 16);
    }
    // charge meter: thin gradient line along top edge
    var cg2 = ctx.createLinearGradient(0, 0, W, 0);
    cg2.addColorStop(0, hsl(hueC, 100, 55, 0.9)); cg2.addColorStop(1, hsl(hueC + 160, 100, 55, 0.9));
    ctx.fillStyle = cg2; ctx.fillRect(0, 0, W * charge, 2);
  }

  // ---------- loop ----------
  var last = performance.now();
  function loop(now) {
    var dt = Math.min(0.05, Math.max(0.001, (now - last) / 1000)); last = now;
    clock += dt;
    var playing = hasTrack && !audio.paused && !audio.ended && !!analyser;
    analyse(dt, playing);
    frame(dt, playing);
    if (!seeking && isFinite(audio.duration) && audio.duration > 0) {
      seek.value = Math.round(audio.currentTime / audio.duration * 1000);
      curEl.textContent = fmt(audio.currentTime);
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
