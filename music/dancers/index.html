<!DOCTYPE html>
<!--
  Prototype: DANCERS — a troupe of seven geometric characters on a lit dance floor.
  Influence dials: trippy 1 / beautiful 2 / technical 0 / dancing 5 / colorful 4 / intense 3
  Mapping: kick -> anticipation crouch, then stretch+hop (alternating groups, rippling out from the lead)
           and a rate-limited floor-tile colour change; snare/hat onsets -> full-body spins;
           mid energy -> arm sway + light beams; melody pitch -> the lead dancer's arm height + note sparks;
           sections (or detected energy shifts / every 16 beats) -> formation changes; overall energy -> how many jump.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dancers — music visualizer prototype</title>
<style>
  :root { --fg:#ece6f5; --dim:#9a90ad; --acc:#ff5fa2; --bg:#0b0812; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font:14px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow:hidden; }
  body { display:flex; flex-direction:column; height:100vh; height:100dvh; }
  header { display:flex; align-items:center; gap:10px; padding:10px 14px; min-width:0; }
  header h1 { margin:0; font-size:15px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; }
  #badge { font-size:11px; font-weight:700; letter-spacing:.12em; padding:2px 7px; border-radius:999px;
    border:1px solid #5d5270; color:var(--dim); }
  #badge.score { border-color:var(--acc); color:var(--acc); }
  #track { color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; flex:1; text-align:right; }
  #stage { position:relative; flex:1; min-height:0; }
  #stage canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #hint { position:absolute; left:0; right:0; top:14px; text-align:center; color:var(--dim);
    font-size:13px; letter-spacing:.04em; pointer-events:none; transition:opacity .6s; }
  #dance { position:absolute; left:0; right:0; bottom:12px; text-align:center; color:var(--fg);
    font-size:13px; font-style:italic; letter-spacing:.03em; pointer-events:none; opacity:0; transition:opacity .9s; text-shadow:0 1px 8px rgba(0,0,0,.8); }
  #drop { position:absolute; inset:10px; border:2px dashed var(--acc); border-radius:14px; display:none;
    align-items:center; justify-content:center; font-size:18px; color:var(--acc); background:rgba(11,8,18,.7);
    pointer-events:none; }
  body.dragging #drop { display:flex; }
  .controls { display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; padding:10px 14px 12px; }
  #play { width:40px; height:40px; border-radius:50%; border:none; background:var(--acc); color:#140a14;
    font-size:16px; cursor:pointer; flex:none; }
  #play:disabled { background:#3a3247; color:#776c88; cursor:default; }
  #seek { flex:1 1 160px; min-width:120px; accent-color:var(--acc); }
  #time { font-variant-numeric:tabular-nums; color:var(--dim); font-size:12px; flex:none; }
  .file { flex:none; font-size:12px; color:var(--dim); border:1px solid #3a3247; border-radius:8px; padding:6px 10px;
    cursor:pointer; white-space:nowrap; }
  .file:hover { color:var(--fg); border-color:#6a5d80; }
  .file input { display:none; }
</style>
</head>
<body>
<header>
  <h1>Dancers</h1>
  <span id="badge">FFT</span>
  <span id="track">No track loaded</span>
</header>
<main id="stage">
  <canvas id="cv"></canvas>
  <div id="hint">Drop a song anywhere · or choose a file below</div>
  <div id="dance"></div>
  <div id="drop">Drop audio (and/or a .viz.json) to dance</div>
</main>
<div class="controls">
  <button id="play" disabled aria-label="Play">&#9654;</button>
  <input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek" disabled>
  <span id="time">0:00 / 0:00</span>
  <label class="file">Audio file<input id="fileAudio" type="file" accept="audio/*,.mp3,.wav,.ogg,.flac,.m4a"></label>
  <label class="file">Score .viz.json<input id="fileViz" type="file" accept=".json,application/json"></label>
</div>
<audio id="audio" preload="auto"></audio>
<script>
  // ---- container song selector (producer patch 2026-10-21) ----
  (function () {
    var s = new URLSearchParams(location.search).get('song');
    if (!s) return;
    s = s.toLowerCase().replace(/[^a-z0-9-]/g, '');
    if (!s || s === 'demo') return;
    window.__songTitle = s.replace(/-/g, ' ').replace(/\b\w/g, function (c) { return c.toUpperCase(); });
    var of = window.fetch.bind(window);
    window.fetch = function (u, o) {
      if (typeof u === 'string') {
        u = u.split('../assets/demo.mp3').join('../assets/' + s + '.mp3')
             .split('../assets/demo.viz.json').join('../assets/' + s + '.viz.json')
             .split('../assets/demo.dance.json').join('../assets/' + s + '.dance.json');
      }
      return of(u, o);
    };
  })();

(function () {
  'use strict';

  // ---------- DOM ----------
  var $ = function (id) { return document.getElementById(id); };
  var cv = $('cv'), cx = cv.getContext('2d'), stage = $('stage');
  var audio = $('audio'), playBtn = $('play'), seek = $('seek'), timeEl = $('time');
  var badge = $('badge'), trackEl = $('track'), hint = $('hint');

  var W = 300, H = 300, DPR = 1;
  function resize() {
    var r = stage.getBoundingClientRect();
    DPR = Math.min(window.devicePixelRatio || 1, 2.5);
    W = Math.max(1, r.width); H = Math.max(1, r.height);
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    cx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
  window.addEventListener('resize', resize);
  resize();

  var mq = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  var calm = !!(mq && mq.matches);
  if (mq) { var onMq = function () { calm = mq.matches; }; if (mq.addEventListener) mq.addEventListener('change', onMq); else if (mq.addListener) mq.addListener(onMq); }

  // ---------- helpers ----------
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function perf() { return performance.now() / 1000; }
  function fmt(s) { if (!isFinite(s) || s < 0) s = 0; var m = Math.floor(s / 60), r = Math.floor(s % 60); return m + ':' + (r < 10 ? '0' : '') + r; }
  function smooth(cur, target, dt, tAtt, tDec) {
    var tau = target > cur ? tAtt : tDec; return cur + (target - cur) * (1 - Math.exp(-dt / tau));
  }
  function lowerBound(arr, t, key) { // first index with value >= t
    var lo = 0, hi = arr.length;
    while (lo < hi) { var mid = (lo + hi) >> 1; var v = key ? arr[mid][key] : arr[mid]; if (v < t) lo = mid + 1; else hi = mid; }
    return lo;
  }

  // ---------- audio graph ----------
  var actx = null, analyser = null, freq = null, prevFreq = null, binHz = 0;
  var bands = { low: [0, 0], mid: [0, 0], high: [0, 0] };
  function ensureCtx() {
    if (actx) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    actx = new AC();
    var src = actx.createMediaElementSource(audio);
    analyser = actx.createAnalyser();
    analyser.fftSize = 2048;
    analyser.smoothingTimeConstant = 0.5;
    src.connect(analyser); analyser.connect(actx.destination);
    freq = new Uint8Array(analyser.frequencyBinCount);
    prevFreq = new Uint8Array(analyser.frequencyBinCount);
    binHz = actx.sampleRate / analyser.fftSize;
    function rng(f0, f1) { return [Math.max(1, Math.round(f0 / binHz)), Math.min(freq.length - 1, Math.round(f1 / binHz))]; }
    bands.low = rng(20, 140); bands.mid = rng(140, 2000); bands.high = rng(2000, 12000);
  }

  // ---------- state ----------
  var trackLoaded = false, trackIsDemo = false, curUrl = null;
  var score = null, scoreFromDemo = false;     // sidecar
  var cur = { kick: 0, snare: 0, melody: 0, section: -1 };
  var E = { low: 0, mid: 0, high: 0, all: 0, slow: 0, slower: 0, centroid: 0.5 };
  var peak = { low: 0.2, mid: 0.2, high: 0.2 };
  var fluxHist = { low: [], high: [], mid: [] };
  var lastOnset = { low: -9, high: -9, mid: -9 };
  var beatTimes = [], beatPeriod = 0.6, lastBeatAt = -9, beatCount = 0;   // in "clock" seconds
  var lastFlashPerf = -9, flash = 0, tileParity = 0, lastTileSwap = -9;
  var formation = 0, lastFormationChange = -99, beatsSinceForm = 0, sectionEnergy = -1;
  var groove = 0;          // continuously advancing beat phase (beats)
  var hueBase = 300;
  // ---------- dance guide (producer amendment 2026-10-21, per Downbeat contract) ----------
  // Optional intent layer: <song>.dance.json — [{t, until, stage, feeling, dance, energy, palette, support}]
  // stage drives formation handoffs + the caption; palette drives hueBase; support stays dimmer by design.
  var dance = null, danceIdx = -1, danceHueTarget = null;
  var danceEl = $('dance');
  function paletteHue(name) {
    var s = String(name || '').toLowerCase();
    var known = { 'candlelight': 38, 'deep cave violet': 268, 'moss green': 130, 'ember orange': 24, 'blood rust': 8, 'molten gold': 45, 'white-hot': 48 };
    if (known[s] !== undefined) return known[s];
    if (/violet|purple/.test(s)) return 270; if (/green/.test(s)) return 130;
    if (/gold|amber|candle/.test(s)) return 43; if (/rust|red|blood/.test(s)) return 8;
    if (/blue/.test(s)) return 212; if (/teal/.test(s)) return 175; if (/pink|magenta/.test(s)) return 325;
    if (/orange|ember/.test(s)) return 26; if (/white|silver/.test(s)) return 46;
    var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360; return h;
  }
  function loadDance(arr) {
    if (!Array.isArray(arr)) return false;
    var ms = arr.filter(function (m) { return m && isFinite(m.t) && m.stage; });
    if (!ms.length) return false;
    dance = ms; danceIdx = -1; return true;
  }
  function runDance(t) {
    var idx = -1;
    for (var i = 0; i < dance.length; i++) { if (t >= dance[i].t && (dance[i].until == null || t < dance[i].until)) { idx = i; break; } }
    if (idx === danceIdx) return;
    danceIdx = idx;
    if (idx < 0) { danceEl.style.opacity = 0; danceHueTarget = null; return; }
    var m = dance[idx];
    danceHueTarget = paletteHue(m.palette);
    if (isFinite(m.energy)) sectionEnergy = m.energy;
    nextFormation();  // handoff: the troupe re-forms around the new lead (crossfade via formation easing)
    danceEl.style.opacity = 0;
    setTimeout(function () {
      danceEl.textContent = 'On stage: ' + m.stage + (m.feeling ? ' — ' + m.feeling : '') + (m.dance ? ' · ' + m.dance : '');
      danceEl.style.opacity = 1;
    }, 450);
  }
  var queue = [];          // scheduled events {at (perf s), fn}
  var particles = [];
  var idle = { t: 0, next: 0, n: 0 };
  var clockMode = 'idle';  // 'idle' | 'music'
  var snareCount = 0;

  function schedule(at, fn) { queue.push({ at: at, fn: fn }); }

  // ---------- formations (x 0..1 across, d 0..1 back->front) ----------
  var N = 7, LEAD = 3;
  var FORMS = [
    function (i) { return { x: 0.12 + 0.76 * i / 6, d: 0.55 }; },                                              // line
    function (i) { var k = i - 3; return { x: 0.5 + k * 0.125, d: 0.95 - Math.abs(k) * 0.23 }; },               // vee
    function (i) { var a = Math.PI * (0.12 + 0.76 * i / 6); return { x: 0.5 - Math.cos(a) * 0.38, d: 0.2 + Math.sin(a) * 0.65 }; }, // arc
    function (i) { return i < 4 ? { x: 0.2 + 0.2 * i, d: 0.22 } : { x: 0.3 + 0.2 * (i - 4), d: 0.85 }; },        // two rows
    function (i, g) { if (i === LEAD) return { x: 0.5, d: 0.6 }; var j = i > LEAD ? i - 1 : i; var a = g * 0.35 + j / 6 * Math.PI * 2; return { x: 0.5 + Math.cos(a) * 0.33, d: 0.55 + Math.sin(a) * 0.4 }; }, // ring around lead
    function (i) { return { x: 0.12 + 0.76 * i / 6, d: i % 2 ? 0.28 : 0.86 }; },                                // zigzag
    function (i) { if (i === LEAD) return { x: 0.5, d: 0.98 }; var a = i / 7 * Math.PI * 2 + 0.4; return { x: 0.5 + Math.cos(a) * 0.2, d: 0.42 + Math.sin(a) * 0.26 }; } // huddle
  ];
  function nextFormation() {
    var f; do { f = Math.floor(Math.random() * FORMS.length); } while (f === formation);
    setFormation(f);
  }
  function setFormation(f) {
    formation = f; lastFormationChange = perf(); beatsSinceForm = 0;
    // everyone does a little travelling hop into the new spot
    for (var i = 0; i < N; i++) dancers[i].hopSoon = true;
  }

  // ---------- dancers ----------
  var SHAPES = ['tri', 'square', 'hex', 'star', 'diamond', 'circle', 'pent'];
  var HUES = [335, 18, 48, 285, 170, 205, 110];
  function Dancer(i) {
    var p = FORMS[0](i, 0);
    this.i = i; this.shape = SHAPES[i]; this.hue = HUES[i];
    this.x = p.x; this.vx = 0; this.d = p.d; this.vd = 0;
    this.q = 0; this.qv = 0;               // squash (+) / stretch (-)
    this.jy = 0; this.jv = 0;              // hop height in body units
    this.ang = 0; this.angv = 0; this.angT = 0; this.spinDir = i % 2 ? 1 : -1;
    this.arm = [0.4, 0.4]; this.armv = [0, 0];
    this.hx = 0; this.hy = 0; this.hvx = 0; this.hvy = 0;  // head follow-through offset
    this.lean = 0; this.prevVx = 0;
    this.noteArm = 0; this.noteUntil = 0; this.noteHue = 0;
    this.hopSoon = false; this.size = i === LEAD ? 1.12 : 1;
  }
  var dancers = []; for (var di = 0; di < N; di++) dancers.push(new Dancer(di));

  function stagger(i) { return Math.abs(i - LEAD) * 0.035; }

  Dancer.prototype.kick = function (s, jump) {
    var amp = calm ? 0.35 : 1;
    if (jump && this.jy <= 0.001) {
      this.qv -= 9 * s * amp;                         // release the crouch into a stretch
      this.jv = (3.4 + 1.4 * s) * amp * (0.7 + 0.3 * intensity());
      this.jy = 0.0001;
    } else {
      this.qv += 6.5 * s * amp;                        // down-beat bob
    }
    this.armv[0] += 5 * s * amp; this.armv[1] += 5 * s * amp;
    if (!calm && jump && Math.random() < 0.6) burst(this, 3, s);
  };
  Dancer.prototype.spin = function () {
    if (calm) { this.armv[0] -= 3; this.armv[1] += 3; return; }
    if (Math.abs(this.ang - this.angT) < 0.6) { this.angT += Math.PI * 2 * this.spinDir; this.spinDir = -this.spinDir; }
  };

  function intensity() {
    var e = E.slow;
    if (score && sectionEnergy >= 0) e = 0.5 * e + 0.5 * sectionEnergy;
    if (clockMode === 'idle') e = 0.35;
    return clamp(e, 0, 1);
  }

  // ---------- beat bookkeeping ----------
  function registerBeat(t) {
    if (t - lastBeatAt > 0.2) {
      var dt = t - lastBeatAt;
      if (dt > 0.27 && dt < 1.5) { beatTimes.push(dt); if (beatTimes.length > 9) beatTimes.shift(); }
      var s = beatTimes.slice().sort(function (a, b) { return a - b; });
      if (s.length >= 3) beatPeriod = s[s.length >> 1];
    }
    lastBeatAt = t;
  }

  function fireKick(strength, lead) {   // lead = seconds until the hit actually lands
    lead = Math.max(0, lead || 0);
    var now = perf();
    beatCount++; beatsSinceForm++;
    var parity = beatCount % 2, inten = intensity();
    for (var i = 0; i < N; i++) {
      (function (dn, i) {
        var jump = ((i + parity) % 2 === 0) || inten > 0.78 || dn.hopSoon;
        dn.hopSoon = false;
        schedule(now + lead + stagger(i), function () { dn.kick(strength, jump); });
      })(dancers[i], i);
    }
    schedule(now + lead, function () {
      var p = perf(), minGap = calm ? 0.75 : 0.34;   // never more than ~3 flashes / s
      if (p - lastFlashPerf >= minGap) {
        lastFlashPerf = p; flash = calm ? 0.25 : clamp(0.55 + 0.45 * strength, 0, 1);
        tileParity ^= 1; lastTileSwap = p;
      }
    });
    if (clockMode !== 'idle' && !(score && score.sections.length) && beatsSinceForm >= 16 && now - lastFormationChange > 6) nextFormation();
  }

  function fireSnare(lead) {
    var now = perf(); snareCount++;
    for (var i = 0; i < N; i++) {
      if ((i + snareCount) % 2 === 0 || i === LEAD && snareCount % 4 === 0) {
        (function (dn, i) { schedule(now + Math.max(0, lead) + stagger(i) * 0.6, function () { dn.spin(); }); })(dancers[i], i);
      }
    }
  }

  function fireNote(midi, dur, lead) {
    var lead_ = dancers[LEAD];
    schedule(perf() + Math.max(0, lead), function () {
      var pn = clamp((midi - 48) / 36, 0, 1);
      lead_.noteArm = 0.35 + pn * 2.6;
      lead_.noteUntil = perf() + Math.max(0.18, Math.min(dur || 0.25, 2));
      lead_.noteHue = ((midi % 12) * 30 + 300) % 360;
      lead_.armv[0] += 3; lead_.armv[1] += 3;
      noteSpark(lead_, lead_.noteHue, pn);
    });
  }

  // ---------- particles ----------
  var dpos = []; // cached screen geometry per dancer (feet, hands)
  function burst(dn, n, s) {
    var g = dpos[dn.i]; if (!g || particles.length > 260) return;
    for (var k = 0; k < n; k++) {
      particles.push({ x: g.fx + (Math.random() - 0.5) * g.u * 0.5, y: g.fy, vx: (Math.random() - 0.5) * g.u * 3,
        vy: -g.u * (1.5 + Math.random() * 2.5 * s), g: g.u * 6, life: 0.9, max: 0.9,
        hue: (dn.hue + Math.random() * 60 - 30 + 360) % 360, r: g.u * (0.04 + Math.random() * 0.04), kind: 'c' });
    }
  }
  function noteSpark(dn, hue, pn) {
    var g = dpos[dn.i]; if (!g || particles.length > 300) return;
    for (var k = 0; k < 2; k++) {
      var h = g.hands[k];
      particles.push({ x: h[0], y: h[1], vx: (k ? 1 : -1) * g.u * 0.4, vy: -g.u * (0.8 + pn * 1.2), g: -g.u * 0.2,
        life: calm ? 1.6 : 1.4, max: calm ? 1.6 : 1.4, hue: hue, r: g.u * (0.06 + pn * 0.05), kind: 'n' });
    }
  }

  // ---------- analysis ----------
  function bandAvg(b) { var s = 0; for (var k = b[0]; k <= b[1]; k++) s += freq[k]; return s / ((b[1] - b[0] + 1) * 255); }
  function bandFlux(b) { var s = 0; for (var k = b[0]; k <= b[1]; k++) { var d = freq[k] - prevFreq[k]; if (d > 0) s += d; } return s / ((b[1] - b[0] + 1) * 255); }
  function onset(name, f, mult, minAbs, cool, t) {
    var h = fluxHist[name]; h.push(f); if (h.length > 50) h.shift();
    if (h.length < 12) return false;
    var m = 0, v = 0, k; for (k = 0; k < h.length; k++) m += h[k]; m /= h.length;
    for (k = 0; k < h.length; k++) v += (h[k] - m) * (h[k] - m); v = Math.sqrt(v / h.length);
    if (f > m + mult * v && f > minAbs && t - lastOnset[name] >= cool) { lastOnset[name] = t; return true; }
    return false;
  }
  function resetFlux() { fluxHist.low = []; fluxHist.high = []; fluxHist.mid = []; lastOnset.low = lastOnset.high = lastOnset.mid = -9; if (prevFreq && freq) prevFreq.set(freq); }

  function analyze(dt, t) {
    analyser.getByteFrequencyData(freq);
    var raw = { low: bandAvg(bands.low), mid: bandAvg(bands.mid), high: bandAvg(bands.high) };
    var fl = bandFlux(bands.low), fh = bandFlux(bands.high), fm = bandFlux(bands.mid);
    // spectral centroid of mid+high (0..1, log-ish)
    var num = 0, den = 0;
    for (var k = bands.mid[0]; k <= bands.high[1]; k++) { num += freq[k] * k; den += freq[k]; }
    var cen = den > 0 ? clamp(Math.log(num / den / bands.mid[0]) / Math.log(bands.high[1] / bands.mid[0]), 0, 1) : 0.5;
    prevFreq.set(freq);
    ['low', 'mid', 'high'].forEach(function (b) {
      peak[b] = Math.max(raw[b], peak[b] * Math.exp(-dt / 6), 0.05);
      E[b] = smooth(E[b], clamp(raw[b] / peak[b], 0, 1), dt, 0.02, 0.18);
    });
    E.centroid = smooth(E.centroid, cen, dt, 0.15, 0.4);

    var kickOn = onset('low', fl, 1.5, 0.012, 0.25, t);
    var hatOn = onset('high', fh, 1.8, 0.01, 0.18, t);
    var midOn = onset('mid', fm, 1.8, 0.01, 0.2, t);
    var useScoreKick = score && score.kick.length;
    var useScoreSnare = score && score.snare.length;
    var useScoreMel = score && score.melody.length;
    if (kickOn && !useScoreKick) { registerBeat(t); fireKick(clamp(0.5 + fl * 8, 0.5, 1), 0); }
    if (hatOn && !useScoreSnare) fireSnare(0);
    if (midOn && !useScoreMel && !calm) {
      var ld = dancers[LEAD];
      ld.noteArm = 0.4 + E.centroid * 2.4; ld.noteUntil = perf() + 0.25; ld.noteHue = (200 + E.centroid * 200) % 360;
      noteSpark(ld, ld.noteHue, E.centroid);
    }
  }

  // ---------- score (sidecar) ----------
  function numArr(a) { return Array.isArray(a) ? a.filter(function (x) { return typeof x === 'number' && isFinite(x); }).sort(function (a, b) { return a - b; }) : []; }
  function loadScore(obj, fromDemo) {
    if (!obj || typeof obj !== 'object') return false;
    var s = {
      kick: numArr(obj.kick), snare: numArr(obj.snare),
      melody: (Array.isArray(obj.melody) ? obj.melody : []).filter(function (n) { return n && isFinite(n.t) && isFinite(n.midi); })
        .map(function (n) { return { t: +n.t, midi: +n.midi, dur: isFinite(n.dur) ? +n.dur : 0.25 }; }).sort(function (a, b) { return a.t - b.t; }),
      sections: (Array.isArray(obj.sections) ? obj.sections : []).filter(function (x) { return x && isFinite(x.t); })

  seek.addEventListener('input', function () {
    seeking = true;
    if (isFinite(audio.duration)) audio.currentTime = seek.value / 1000 * audio.duration;
  });
  seek.addEventListener('change', function () { seeking = false; seek.blur(); });
  document.addEventListener('keydown', function (e) {
    if (e.code === 'Space' || e.key === ' ') { e.preventDefault(); if (!e.repeat) toggle(); }
  }, true);
  document.addEventListener('keyup', function (e) { if (e.code === 'Space' || e.key === ' ') e.preventDefault(); }, true);

  function setTrack(url, name, isDemo) {
    if (curUrl && curUrl !== url) { try { URL.revokeObjectURL(curUrl); } catch (e) {} }
    curUrl = url;
    audio.pause();
    audio.src = url; audio.load();
    trackLoaded = true; trackIsDemo = isDemo;
    trackEl.textContent = name;
    playBtn.disabled = false; seek.disabled = false; seek.value = 0;
    if (!isDemo && score && scoreFromDemo) clearScore();   // demo score does not describe a user track
    if (!isDemo) { dance = null; danceIdx = -1; danceHueTarget = null; danceEl.style.opacity = 0; }  // demo dance guide does not describe a user track
    resetCursors(); setPlayIcon();
  }
  function loadAudioFile(f) { setTrack(URL.createObjectURL(f), f.name, false); }
  function loadVizFile(f) {
    var rd = new FileReader();
    rd.onload = function () { try { if (!loadScore(JSON.parse(rd.result), false)) alert('That .viz.json had no kick/snare/melody/sections data.'); } catch (e) { alert('Could not read that .viz.json: ' + e.message); } };
    rd.readAsText(f);
  }
  function isViz(f) { return /\.json$/i.test(f.name) || f.type === 'application/json'; }
  function isAudio(f) { return /^audio\//.test(f.type) || /\.(mp3|wav|ogg|oga|flac|m4a|aac|opus|webm)$/i.test(f.name); }

  $('fileAudio').addEventListener('change', function () { if (this.files[0]) loadAudioFile(this.files[0]); this.value = ''; });
  $('fileViz').addEventListener('change', function () { if (this.files[0]) loadVizFile(this.files[0]); this.value = ''; });

  var dragDepth = 0;
  window.addEventListener('dragenter', function (e) { e.preventDefault(); dragDepth++; document.body.classList.add('dragging'); });
  window.addEventListener('dragleave', function () { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) document.body.classList.remove('dragging'); });
  window.addEventListener('dragover', function (e) { e.preventDefault(); });
  window.addEventListener('drop', function (e) {
    e.preventDefault(); dragDepth = 0; document.body.classList.remove('dragging');
    var fs = e.dataTransfer && e.dataTransfer.files ? Array.prototype.slice.call(e.dataTransfer.files) : [];
    var a = null, v = null;
    fs.forEach(function (f) {
      if (/dance/i.test(f.name) && isViz(f)) { var rd2 = new FileReader(); rd2.onload = function () { try { loadDance(JSON.parse(rd2.result)); } catch (e) {} }; rd2.readAsText(f); }
      else if (isViz(f)) v = v || f; else if (isAudio(f)) a = a || f;
    });
    if (a) loadAudioFile(a);
    if (v) loadVizFile(v);   // after audio, so a dropped pair keeps its score
  });

  // ---------- demo auto-load (silent fallback to picker) ----------
  function tryDemo() {
    if (!window.fetch) return;
    fetch('../assets/demo.mp3').then(function (r) { if (!r.ok) throw new Error('no demo'); return r.blob(); })
      .then(function (b) {
        if (trackLoaded) return;                      // user already picked something
        setTrack(URL.createObjectURL(b), (window.__songTitle || 'Mountain King v1 (demo)'), true);
        fetch('../assets/demo.dance.json').then(function (r) { if (!r.ok) throw new Error('no dance guide'); return r.json(); })
          .then(function (j) { if (trackIsDemo) loadDance(j); }).catch(function () {});
        return fetch('../assets/demo.viz.json').then(function (r) { if (!r.ok) throw new Error('no sidecar'); return r.json(); })
          .then(function (j) { if (trackIsDemo && !score) loadScore(j, true); });
      })
      .catch(function () { /* file:// or missing asset: picker path stays available */ });
  }

  tryDemo();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
